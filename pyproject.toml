[project]
name = "slimproxy"
version = "0.1.0"
description = "Slim forward proxy with IP, auth, and destination filtering"
readme = "README.md"
license = "MIT"
keywords = ["proxy", "forward-proxy", "http-proxy", "filtering", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
]
authors = [
    { name = "Hugo Batista <code at hugobatista.com>" }
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "proxy.py>=2.4.0",
]

[project.urls]
Homepage = "https://github.com/hugobatista/slimproxy"
Repository = "https://github.com/hugobatista/slimproxy"
Documentation = "https://github.com/hugobatista/slimproxy"

[project.scripts]
slimproxy = "slimproxy.cli:app"

[dependency-groups]
lint = [
    "mypy>=1.11.0",
    "ruff>=0.6.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]
dev = [
    "hatch>=1.16.5",
    {include-group = "lint"},
    {include-group = "test"},
]

[tool.uv]
required-version = "0.11.18"
exclude-newer = "30 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slimproxy"]

[tool.hatch.envs.default]
type = "virtual"
path = ".venv"

[tool.hatch.envs.default.scripts]
lint = "ruff check . --fix"
format = "ruff format ."
lint-check = "ruff check ."
format-check = "ruff format --check ."
test = "pytest"
typecheck = "mypy"
validate = ["lint", "format", "test", "typecheck"]
check = ["lint-check", "format-check", "test", "typecheck"]

[tool.pytest.ini_options]
addopts = "-v"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/slimproxy"]
omit = ["*/__init__.py", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.mypy]
python_version = "3.11"
strict = true
incremental = false
check_untyped_defs = true
files = ["src"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["proxy", "proxy.*"]
ignore_missing_imports = true
disable_error_code = ["misc"]

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
