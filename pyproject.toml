[project]
name = "slimproxy"
version = "0.1.0"
description = "Slim forward proxy with IP, auth, and destination filtering"
authors = [
    { name = "Hugo Batista <code at hugobatista.com>" }
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0,<1.0.0",
    "proxy.py>=2.4.0,<3.0.0",
]

[project.scripts]
slimproxy = "slimproxy.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.uv]
exclude-newer = "30 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slimproxy"]

[tool.hatch.envs.default]
dependencies = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.hatch.envs.default.scripts]
lint = "ruff check . --fix"
format = "ruff format ."
format-check = "ruff format --check ."
test = "pytest src tests --cov=src/slimproxy --cov-fail-under=100 -v"
typecheck = "mypy src --strict --no-incremental"
validate = ["lint", "format", "test", "typecheck"]
check = ["lint", "format", "test", "typecheck"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/slimproxy"]
omit = ["*/__init__.py", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
files = ["src"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["proxy", "proxy.*"]
ignore_missing_imports = true
disable_error_code = ["misc"]

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
